[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen-tool"
version = "1.0.0"
description = "Generate strong passwords and passphrases from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ronald Allan V. Tomimbang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
passgen = "passgen.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
